<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>Asistencia · Antología Box23</title>
    <link rel="icon" type="image/png" href="images/logo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ── Variables ─────────────────────────────────────────── */
:root {
    --teal:    #27F9D4;
    --pink:    #FF729F;
    --yellow:  #F0F66E;
    --bg:      #0d1117;
    --surface: #161b22;
    --card:    #1c2333;
    --border:  rgba(255,255,255,.08);
    --text:    #e6edf3;
    --muted:   #8b949e;
    --success: #3fb950;
    --danger:  #f85149;
    --warning: #d29922;
    --radius:  12px;
}

/* ── Reset & base ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Barlow', sans-serif; overflow-x: hidden; }

/* ── Header ─────────────────────────────────────────────── */
.app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    position: sticky;
    top: 0;
    z-index: 100;
}
.brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 1.35rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--teal);
    white-space: nowrap;
}
.brand span { color: var(--text); font-weight: 400; }

.header-date {
    font-size: .8rem;
    color: var(--muted);
    text-align: right;
    line-height: 1.3;
    cursor: pointer;
    padding: .1rem .2rem;
    border-radius: 6px;
    transition: background .15s ease;
    position: relative;
}
.header-date:hover { background: rgba(255,255,255,.05); }
.header-date strong { color: var(--text); font-size: .95rem; display: block; }
.header-date.is-today strong { color: var(--teal); }
#datePicker {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    border: none;
    cursor: pointer;
}
.date-nav {
    display: flex;
    align-items: center;
    gap: .35rem;
}
.date-nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .75rem;
    cursor: pointer;
    transition: all .15s ease;
    flex-shrink: 0;
}
.date-nav-btn:hover { color: var(--teal); border-color: var(--teal); }
.date-nav-btn:active { transform: scale(.92); }
.btn-today {
    background: rgba(39,249,212,.12);
    border: 1px solid rgba(39,249,212,.4);
    color: var(--teal);
    font-size: .68rem;
    font-weight: 600;
    padding: .2rem .5rem;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: .03em;
    transition: all .15s ease;
}
.btn-today:hover { background: rgba(39,249,212,.22); }

/* ── Counter bar ─────────────────────────────────────────── */
.counter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .5rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    font-size: .82rem;
}
.counter-item { display: flex; align-items: center; gap: .4rem; }
.counter-item .num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    line-height: 1;
}
.counter-item .lbl { color: var(--muted); font-size: .75rem; line-height: 1.2; }
.counter-item.c-present .num { color: var(--success); }
.counter-item.c-absent  .num { color: var(--danger); }
.counter-item.c-total   .num { color: var(--teal); }
.divider-v { width: 1px; height: 2rem; background: var(--border); }

/* ── Search bar ──────────────────────────────────────────── */
.search-wrap {
    padding: .75rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: .5rem;
    align-items: center;
}
.search-wrap input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: .55rem .9rem;
    font-size: .9rem;
    font-family: 'Barlow', sans-serif;
    outline: none;
    transition: border-color .15s;
}
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap input:focus { border-color: var(--teal); }
.btn-mark-all {
    background: rgba(39,249,212,.12);
    border: 1px solid var(--teal);
    color: var(--teal);
    border-radius: 8px;
    padding: .5rem .75rem;
    font-size: .78rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
}
.btn-mark-all:hover { background: rgba(39,249,212,.22); }

/* ── User list ───────────────────────────────────────────── */
.user-list {
    padding: .5rem .75rem 5rem;
    display: flex;
    flex-direction: column;
    gap: .4rem;
}

.user-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .55rem .8rem;
    gap: .3rem;
    transition: border-color .15s, transform .1s;
    animation: slideIn .2s ease both;
}
.user-row:active { transform: scale(.99); }
.user-row.is-present { border-color: rgba(63,185,80,.35); background: rgba(63,185,80,.06); }
.user-row.is-absent  { border-color: rgba(248,81,73,.25); background: rgba(248,81,73,.04); }

@keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}

.user-info { min-width: 0; }
.user-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: .02em;
}
.user-meta {
    font-size: .73rem;
    color: var(--muted);
    margin-top: .1rem;
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    align-items: center;
}
.meta-tag {
    background: rgba(255,255,255,.06);
    border-radius: 4px;
    padding: .1rem .35rem;
    font-size: .68rem;
}

/* Vigencia badge en la fila */
.vigencia-inline {
    font-size: .7rem;
    padding: .1rem .4rem;
    border-radius: 4px;
    white-space: nowrap;
}
.vig-ok      { background: rgba(63,185,80,.18);  color: #3fb950; }
.vig-warn    { background: rgba(210,153,34,.18);  color: #d29922; }
.vig-expired { background: rgba(248,81,73,.18);   color: #f85149; }
.vig-none    { background: rgba(139,148,158,.12); color: #8b949e; }

/* ── Action buttons ──────────────────────────────────────── */
.btn-group-attend {
    display: flex;
    gap: .25rem;
    flex-shrink: 0;
}
.btn-attend {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 2px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all .15s;
    background: rgba(255,255,255,.05);
    color: var(--muted);
}
.btn-attend:hover  { transform: scale(1.08); }
.btn-attend:active { transform: scale(.94); }

.btn-attend.present        { background: rgba(63,185,80,.15); border-color: rgba(63,185,80,.4); color: var(--success); }
.btn-attend.present.active { background: var(--success); border-color: var(--success); color: #0d1117; }
.btn-attend.absent         { background: rgba(248,81,73,.12); border-color: rgba(248,81,73,.3); color: var(--danger); }
.btn-attend.absent.active  { background: var(--danger);  border-color: var(--danger);  color: #fff; }
.btn-attend.absent:disabled,
.btn-attend.absent.is-disabled {
    opacity: .35;
    cursor: not-allowed;
    pointer-events: auto;
}
.btn-attend.emergency { 
    background: rgba(37,211,102,.12); 
    border-color: rgba(37,211,102,.3); 
    color: #25d366; 
}
.btn-attend.emergency:hover { 
    background: rgba(37,211,102,.2); 
    border-color: rgba(37,211,102,.5); 
}

/* ── Toast ───────────────────────────────────────────────── */
.toast-box {
    position: fixed;
    bottom: 1.25rem;
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: .65rem 1.2rem;
    font-size: .85rem;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    z-index: 999;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    white-space: nowrap;
    pointer-events: none;
}
.toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-box.success { border-color: rgba(63,185,80,.5); color: var(--success); }
.toast-box.info    { border-color: rgba(39,249,212,.4); color: var(--teal); }

/* ── Loading ─────────────────────────────────────────────── */
#loadingState {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 3rem 1rem;
    color: var(--muted);
}
.spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Error banner ─────────────────────────────────────────── */
.error-banner {
    background: rgba(248,81,73,.1);
    border: 1px solid rgba(248,81,73,.3);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin: 1rem;
    color: var(--danger);
    font-size: .85rem;
    display: none;
}

/* ── Empty state ─────────────────────────────────────────── */
.empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
}
.empty-state i { font-size: 2.5rem; margin-bottom: .75rem; opacity: .3; display: block; }

/* ── Confirm modal overlay ────────────────────────────────── */
.confirm-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 500;
    align-items: flex-end;
    justify-content: center;
}
.confirm-overlay.open { display: flex; }
.confirm-sheet {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 1.5rem 1.25rem;
    width: 100%;
    max-width: 480px;
    animation: slideUp .2s ease;
}
@keyframes slideUp { from { transform: translateY(60px); opacity:0; } to { transform: translateY(0); opacity:1; } }
.confirm-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.2rem; margin-bottom: .4rem; }
.confirm-text  { font-size: .85rem; color: var(--muted); margin-bottom: 1.25rem; }
.confirm-btns  { display: flex; gap: .5rem; }
.confirm-btns button {
    flex: 1; padding: .75rem; border-radius: 8px; font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 1rem; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; border: none;
}
.btn-confirm-yes { background: var(--success); color: #0d1117; }
.btn-confirm-no  { background: var(--border); color: var(--text); }

/* ── Nombre del asistente (usuarios tipo Clase suelta) ───────── */
.user-note {
    font-size: .72rem;
    color: var(--teal);
    display: flex;
    align-items: center;
    gap: .3rem;
    margin-top: .1rem;
}
.confirm-sheet input.note-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: .65rem .75rem;
    font-size: .95rem;
    margin-bottom: 1.25rem;
    font-family: 'Barlow', sans-serif;
}
.confirm-sheet input.note-input:focus { outline: none; border-color: var(--teal); }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- Header -->
<header class="app-header">
    <div class="d-flex align-items-center gap-2">
        <img src="images/logo.png" alt="Antología Box23" style="height:40px;width:auto;object-fit:contain;filter:drop-shadow(0 0 6px rgba(39,249,212,.5))">
        <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;color:#e6edf3">ANTOLOGÍA <span style="color:#27F9D4">BOX23</span></span><span style="font-family:'Barlow Condensed',sans-serif;font-size:1rem;color:var(--muted);margin-left:.35rem">/ Asistencia</span>
    </div>
    <div class="date-nav">
        <button class="date-nav-btn" id="prevDay" title="Día anterior"><i class="fas fa-chevron-left"></i></button>
        <div class="header-date" id="dateDisplay">
            <strong id="headerDay">—</strong>
            <span id="headerDate">cargando...</span>
            <input type="date" id="datePicker">
        </div>
        <button class="date-nav-btn" id="nextDay" title="Día siguiente"><i class="fas fa-chevron-right"></i></button>
        <button class="btn-today" id="btnToday" style="display:none">Hoy</button>
    </div>
</header>

<!-- Counter bar -->
<div class="counter-bar">
    <div class="counter-item c-present">
        <span class="num" id="cntPresent">0</span>
        <span class="lbl">Presentes</span>
    </div>
</div>

<!-- Search + mark all -->
<div class="search-wrap">
    <input type="text" id="searchInput" placeholder="&#xf002;  Buscar usuario..." autocomplete="off" autocorrect="off">
    <button class="btn-mark-all" id="btnMarkAll">
        <i class="fas fa-check-double"></i> Todos presentes
    </button>
</div>

<!-- Error banner -->
<div class="error-banner" id="errorBanner"></div>

<!-- User list -->
<div class="user-list" id="userList">
    <div id="loadingState">
        <div class="spinner"></div>
        <span>Cargando usuarios...</span>
    </div>
</div>

<!-- Toast -->
<div class="toast-box" id="toast"></div>

<!-- Confirm sheet -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-sheet">
        <div class="confirm-title" id="confirmTitle">¿Confirmar?</div>
        <div class="confirm-text"  id="confirmText"></div>
        <div class="confirm-btns">
            <button class="btn-confirm-no"  id="confirmNo">Cancelar</button>
            <button class="btn-confirm-yes" id="confirmYes">Confirmar</button>
        </div>
    </div>
</div>

<!-- ¿Quién asistió? (usuarios "Clase suelta" / esporádicos) -->
<div class="confirm-overlay" id="noteOverlay">
    <div class="confirm-sheet">
        <div class="confirm-title">¿Quién asistió?</div>
        <div class="confirm-text">Registra el nombre de la persona esporádica que asistió, para poder cobrarle luego.</div>
        <input type="text" class="note-input" id="noteInput" placeholder="Ej: Juan Pérez" autocomplete="off">
        <div class="confirm-btns">
            <button class="btn-confirm-no"  id="noteCancel">Cancelar</button>
            <button class="btn-confirm-yes" id="noteSave">Guardar</button>
        </div>
    </div>
</div>

<!-- ── Scripts compartidos con la app principal ────────────── -->
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════
   Página de Asistencia — standalone
   Usa Storage y Utils del proyecto principal.
   No depende de Bootstrap JS, ui.js, ni ningún otro módulo.
   ═══════════════════════════════════════════════════════════ */

const todayStr = Utils.getCurrentDate();
let selectedDate    = todayStr;
let attendanceCache = [];   // registros de asistencia del día
let usersCache      = [];   // usuarios activos sin entrenadores
let searchTerm      = '';

/* ── Cabecera de fecha / navegación ───────────────────────── */
function formatDateStr(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d);
}
function pad2(n) { return String(n).padStart(2, '0'); }
function toDateStr(dateObj) {
    return `${dateObj.getFullYear()}-${pad2(dateObj.getMonth() + 1)}-${pad2(dateObj.getDate())}`;
}
function updateHeaderDate() {
    const date = formatDateStr(selectedDate);
    const days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
    document.getElementById('headerDay').textContent  = days[date.getDay()];
    document.getElementById('headerDate').textContent =
        date.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('datePicker').value = selectedDate;
    document.getElementById('datePicker').max   = todayStr;
    const isToday = selectedDate === todayStr;
    document.getElementById('dateDisplay').classList.toggle('is-today', isToday);
    document.getElementById('btnToday').style.display = isToday ? 'none' : 'inline-block';
}

async function changeDate(newDate) {
    if (!newDate || newDate === selectedDate) return;
    selectedDate = newDate;
    updateHeaderDate();
    try {
        attendanceCache = Storage.getAttendanceByDate(selectedDate);
        renderList();
    } catch (err) {
        showToast('Error al cargar la fecha. Verifica conexión.', 'info');
    }
}

document.getElementById('prevDay').addEventListener('click', () => {
    const d = formatDateStr(selectedDate);
    d.setDate(d.getDate() - 1);
    changeDate(toDateStr(d));
});
document.getElementById('nextDay').addEventListener('click', () => {
    const d = formatDateStr(selectedDate);
    d.setDate(d.getDate() + 1);
    changeDate(toDateStr(d));
});
document.getElementById('btnToday').addEventListener('click', () => changeDate(todayStr));
document.getElementById('datePicker').addEventListener('change', (e) => changeDate(e.target.value));

updateHeaderDate();


/* ── Toast ────────────────────────────────────────────────── */
let toastTimer;
function showToast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = 'toast-box show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ── Confirm sheet ────────────────────────────────────────── */
function showConfirm(title, text) {
    return new Promise(resolve => {
        document.getElementById('confirmTitle').textContent = title;
        document.getElementById('confirmText').textContent  = text;
        document.getElementById('confirmOverlay').classList.add('open');
        const yes = document.getElementById('confirmYes');
        const no  = document.getElementById('confirmNo');
        const close = (val) => {
            document.getElementById('confirmOverlay').classList.remove('open');
            yes.removeEventListener('click', onYes);
            no.removeEventListener('click',  onNo);
            resolve(val);
        };
        const onYes = () => close(true);
        const onNo  = () => close(false);
        yes.addEventListener('click', onYes);
        no.addEventListener('click',  onNo);
    });
}

/* ── Nombre del asistente (usuarios "Clase suelta") ──────────── */
function showNoteSheet(prefill) {
    return new Promise(resolve => {
        const overlay = document.getElementById('noteOverlay');
        const input   = document.getElementById('noteInput');
        input.value = prefill || '';
        overlay.classList.add('open');
        setTimeout(() => input.focus(), 50);
        const save = document.getElementById('noteSave');
        const cancel = document.getElementById('noteCancel');
        const close = (val) => {
            overlay.classList.remove('open');
            save.removeEventListener('click', onSave);
            cancel.removeEventListener('click', onCancel);
            resolve(val);
        };
        const onSave   = () => close(input.value.trim() || null);
        const onCancel = () => close(undefined);
        save.addEventListener('click', onSave);
        cancel.addEventListener('click', onCancel);
    });
}

/* ── Helper: convertir classTime a minutos para ordenar ───── */
function parseClassTime(t) {
    if (!t) return Infinity;                    // sin horario → al final
    const s = String(t).trim().toLowerCase();

    // "6:00 am", "6:00am", "6 pm", "6:30 p.m."
    const m12 = s.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)/);
    if (m12) {
        let h = parseInt(m12[1], 10);
        const m = m12[2] ? parseInt(m12[2], 10) : 0;
        const ap = m12[3].replace(/\./g, '');
        if (ap === 'pm' && h !== 12) h += 12;
        if (ap === 'am' && h === 12) h = 0;
        return h * 60 + m;
    }
    // "18:30", "6:00"
    const m24 = s.match(/(\d{1,2}):(\d{2})/);
    if (m24) return parseInt(m24[1], 10) * 60 + parseInt(m24[2], 10);
    // "6", "18"
    const hOnly = s.match(/^(\d{1,2})$/);
    if (hOnly) return parseInt(hOnly[1], 10) * 60;

    return Infinity;
}

/* ── Contadores ───────────────────────────────────────────── */
function updateCounters() {
    const ids      = usersCache.map(u => u.id);
    const records  = attendanceCache.filter(a => ids.includes(a.userId));
    const present  = records.filter(a => a.status === 'presente').length;
    document.getElementById('cntPresent').textContent = present;
}

/* ── Render lista ─────────────────────────────────────────── */
function renderList() {
    const list = document.getElementById('userList');
    const term = searchTerm.toLowerCase();

    const filtered = term
        ? usersCache.filter(u => u.name.toLowerCase().includes(term))
        : usersCache;

    if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">
            <i class="fas fa-user-slash"></i>
            ${term ? 'Sin resultados para "' + Utils.escapeHtml(term) + '"' : 'No hay usuarios activos'}
        </div>`;
        return;
    }

    list.innerHTML = filtered.map((u, idx) => {
        const rec    = attendanceCache.find(a => a.userId === u.id);
        const status = rec?.status || null;
        const isPresent = status === 'presente';
        const rowCls = isPresent ? 'is-present' : '';

        const noteHtml = rec?.note
            ? `<div class="user-note"><i class="fas fa-user-edit"></i>${Utils.escapeHtml(rec.note)}</div>`
            : '';

        // El botón ✕ solo se activa si el usuario está presente.
        // Si no está presente, queda deshabilitado (no ejecuta nada).
        const removeDisabled = isPresent ? '' : 'disabled';
        const removeTitle    = isPresent ? 'Quitar asistencia' : 'Sin asistencia que quitar';

        return `<div class="user-row ${rowCls}" id="row-${u.id}" style="animation-delay:${idx * 0.025}s">
            <div class="user-info">
                <div class="user-name">${Utils.escapeHtml(u.name)}</div>
                ${noteHtml}
            </div>
            <div class="btn-group-attend">
                <button class="btn-attend present ${isPresent ? 'active' : ''}"
                        onclick="markUser('${u.id}', 'presente')" title="Presente">
                    <i class="fas fa-check"></i>
                </button>
                <button class="btn-attend absent ${isPresent ? '' : 'is-disabled'}"
                        onclick="removeUser('${u.id}')" title="${removeTitle}" ${removeDisabled}>
                    <i class="fas fa-times"></i>
                </button>
                <button class="btn-attend emergency"
                        onclick="contactEmergency('${u.id}')" title="WhatsApp Emergencia">
                    <i class="fab fa-whatsapp"></i>
                </button>
            </div>
        </div>`;
    }).join('');

    updateCounters();
}

/* ── Marcar asistencia ────────────────────────────────────── */
async function markUser(userId, status) {
    const existing = attendanceCache.find(a => a.userId === userId);
    const time     = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    const user     = usersCache.find(u => u.id === userId);

    // Usuarios "Clase suelta" son esporádicos: se registra quién asistió
    // realmente para poder cobrarle luego.
    let note = existing?.note || null;
    if (status === 'presente' && user?.affiliationType === 'Clase suelta') {
        const entered = await showNoteSheet(note);
        if (entered === undefined) return; // canceló, no se marca
        note = entered;
    }

    // Actualizar cache local inmediatamente (UX responsivo)
    if (existing) {
        existing.status = status;
        existing.time   = time;
        existing.note   = note;
    } else {
        attendanceCache.push({ id: 'tmp-' + Date.now(), userId, date: selectedDate, status, time, note });
    }
    renderList();

    // Persistir en Sheets
    try {
        if (existing && !existing.id.startsWith('tmp-')) {
            await Storage.updateAttendance(existing.id, { status, time, note });
        } else {
            const saved = await Storage.addAttendance({ userId, date: selectedDate, status, time, note });
            const idx = attendanceCache.findIndex(a => a.userId === userId);
            if (idx !== -1 && saved) attendanceCache[idx] = { ...attendanceCache[idx], id: saved.id || attendanceCache[idx].id };
        }
        const label = status === 'presente' ? '✓ Presente' : '✗ Ausente';
        showToast(`${user?.name?.split(' ')[0] || ''} — ${label}`, status === 'presente' ? 'success' : 'info');
    } catch (err) {
        showToast('Error al guardar. Verifica conexión.', 'info');
    }
}

/* ── Quitar asistencia (botón ✕) ──────────────────────────── */
/* Regla:
   - Si el usuario NO está registrado como presente → no hace nada.
   - Si está presente → elimina el registro de asistencia (no lo marca ausente). */
async function removeUser(userId) {
    const existing = attendanceCache.find(a => a.userId === userId);
    if (!existing) return;                       // no hay registro → nada
    if (existing.status !== 'presente') return;  // no estaba presente → nada

    const user = usersCache.find(u => u.id === userId);

    // Registro temporal (aún no persistido en Sheets): solo quitarlo de cache
    if (existing.id && existing.id.startsWith('tmp-')) {
        const idx = attendanceCache.indexOf(existing);
        if (idx !== -1) attendanceCache.splice(idx, 1);
        renderList();
        showToast(`${user?.name?.split(' ')[0] || ''} — asistencia eliminada`, 'info');
        return;
    }

    try {
        await Storage.deleteAttendance(existing.id);
        const idx = attendanceCache.indexOf(existing);
        if (idx !== -1) attendanceCache.splice(idx, 1);
        renderList();
        showToast(`${user?.name?.split(' ')[0] || ''} — asistencia eliminada`, 'info');
    } catch (err) {
        showToast('Error al eliminar. Verifica conexión.', 'info');
    }
}

/* ── Marcar todos presentes ───────────────────────────────── */
document.getElementById('btnMarkAll').addEventListener('click', async () => {
    const ok = await showConfirm(
        'Marcar todos presentes',
        '¿Marcar a todos los usuarios activos como presentes ahora?'
    );
    if (!ok) return;

    const time = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    for (const u of usersCache) {
        const existing = attendanceCache.find(a => a.userId === u.id);
        if (existing) { existing.status = 'presente'; existing.time = time; }
        else attendanceCache.push({ id: 'tmp-' + u.id, userId: u.id, date: selectedDate, status: 'presente', time });
    }
    renderList();
    showToast(`${usersCache.length} usuarios marcados como presentes`, 'success');

    // Persistir en segundo plano
    for (const u of usersCache) {
        const existing = Storage.getAttendanceByDate(selectedDate).find(a => a.userId === u.id);
        try {
            if (existing) await Storage.updateAttendance(existing.id, { status: 'presente', time });
            else          await Storage.addAttendance({ userId: u.id, date: selectedDate, status: 'presente', time });
        } catch (_) { /* continuar */ }
    }
});


/* ── Contactar emergencia ─────────────────────────────────── */
function contactEmergency(userId) {
    const user = usersCache.find(u => u.id === userId);
    if (!user) {
        showToast('Usuario no encontrado', 'info');
        return;
    }

    if (!user.emergencyContact || !user.emergencyPhone) {
        showToast('Este usuario no tiene contacto de emergencia registrado', 'info');
        return;
    }

    const userName = user.name;
    const emergencyName = user.emergencyContact;
    const emergencyPhone = (user.emergencyPhone || '').replace(/\D/g, '');

    if (!emergencyPhone || emergencyPhone.length < 10) {
        showToast('Número de emergencia inválido', 'info');
        return;
    }

    const msg = `Hola ${emergencyName}, te contactamos desde Antología Box23 como contacto de emergencia de ${userName}.\n\nNecesitamos comunicarnos contigo por una situación que requiere tu atención.\n\nPor favor, contáctanos lo antes posible.\n\nGracias.`;
    
    const url = `https://wa.me/57${emergencyPhone}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
    
    showToast(`WhatsApp abierto para ${emergencyName}`, 'success');
}

/* ── Búsqueda ────────────────────────────────────────────── */
document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    renderList();
});

/* ── Inicialización ──────────────────────────────────────── */
async function init() {
    const list = document.getElementById('userList');
    try {
        await Storage.initialize();

        usersCache = Storage.getUsers()
            .filter(u => u.status === 'active' && u.affiliationType !== 'Entrenador(a)')
            .sort((a, b) => {
                const ta = parseClassTime(a.classTime);
                const tb = parseClassTime(b.classTime);
                if (ta !== tb) return ta - tb;              // orden por horario
                return a.name.localeCompare(b.name, 'es');  // desempate alfabético
            });
        attendanceCache = Storage.getAttendanceByDate(selectedDate);

        if (usersCache.length === 0) {
            list.innerHTML = `<div class="empty-state">
                <i class="fas fa-users"></i>
                No hay usuarios activos registrados
            </div>`;
            return;
        }
        renderList();
    } catch (err) {
        list.innerHTML = '';
        const banner = document.getElementById('errorBanner');
        banner.style.display = 'block';
        banner.innerHTML = `<i class="fas fa-exclamation-triangle me-2"></i>
            Error al cargar datos: ${err.message}.<br>
            <small>Verifica la conexión con Google Sheets o que SCRIPT_URL esté configurado en storage.js</small>`;
    }
}

init();
</script>
